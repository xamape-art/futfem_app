name: Sync Actas FCF · FUTFEM

on:
  # Automático: cada lunes 10:00 UTC
  schedule:
    - cron: '0 10 * * 1'

  # Manual: control total para backfills o tests
  workflow_dispatch:
    inputs:
      league:
        description: 'FCF group_path de la liga (obligatorio)'
        required: true
        default: 'futbol-femeni/tercera-federacio-futbol-femeni/grup-v'
        type: string
      season:
        description: 'Código temporada FCF'
        required: true
        default: '2627'
        type: choice
        options:
          - '2627'
      dry_run:
        description: 'Solo parsear, no escribir en Supabase'
        default: false
        type: boolean

jobs:
  # ─── PROGRAMADO: todas las ligas activas del matrix ─────────────────────────
  sync-scheduled:
    if: github.event_name == 'schedule'
    name: "Sync ${{ matrix.league }}"
    # En el PC de casa: desde el 05-10-2026 la FCF responde 403 a las IP de
    # GitHub Actions. El runner es Windows, así que los pasos van en pwsh.
    runs-on: [self-hosted, fcf]
    timeout-minutes: 30

    strategy:
      fail-fast: false  # Si una liga falla, las otras siguen
      matrix:
        # ← Añadir aquí nuevas ligas (group_path) cuando se activen
        league:
          - 'futbol-femeni/tercera-federacio-futbol-femeni/grup-v'
          - 'futbol-femeni/preferent-femeni/grup-1'
          - 'futbol-femeni/primera-divisio-femeni/grup-1'
          - 'futbol-femeni/primera-divisio-femeni/grup-2'
          - 'futbol-femeni/preferent-femeni-juvenil/grup-1'
          - 'futbol-femeni/primera-divisio-femeni-juvenil/grup-1'
          - 'futbol-femeni/primera-divisio-femeni-juvenil/grup-2'
          - 'futbol-femeni/primera-divisio-femeni-juvenil/grup-3'
          - 'futbol-femeni/preferent-femeni-infantil/grup-1'
          - 'futbol-femeni/primera-divisio-femeni-infantil/grup-1'
          - 'futbol-femeni/primera-divisio-femeni-infantil/grup-2'
          - 'futbol-femeni/primera-divisio-femeni-infantil/grup-3'
          - 'futbol-femeni/primera-divisio-femeni-infantil/grup-4'
          - 'futbol-femeni/femeni-infantil-f11/grup-1'
          - 'futbol-femeni/segona-divisio-femeni/grup-1'
          - 'futbol-femeni/segona-divisio-femeni/grup-2'
          - 'futbol-femeni/segona-divisio-femeni/grup-3'
          - 'futbol-femeni/segona-divisio-femeni/grup-4'
          - 'futbol-femeni/segona-divisio-femeni/grup-5'
          - 'futbol-femeni/segona-divisio-femeni/grup-6'
          - 'futbol-femeni/segona-divisio-femeni/grup-7'
          - 'futbol-femeni/primera-divisio-femeni-cadet-f11/grup-1'
          - 'futbol-femeni/primera-divisio-femeni-cadet-f11/grup-2'
          - 'futbol-femeni/segona-divisio-femeni-cadet-f11/grup-1'
          - 'futbol-femeni/segona-divisio-femeni-cadet-f11/grup-2'
          - 'futbol-femeni/segona-divisio-femeni-cadet-f11/grup-3'
          - 'futbol-femeni/segona-divisio-femeni-cadet-f11/grup-4'
          - 'futbol-femeni/segona-divisio-femeni-cadet-f11/grup-5'
          - 'futbol-femeni/segona-divisio-femeni-cadet-f11/grup-6'
          - 'futbol-femeni/segona-divisio-femeni-cadet-f11/grup-7'
          - 'futbol-femeni/segona-divisio-femeni-cadet-f11/grup-8'
          - 'futbol-femeni/segona-divisio-femeni-cadet-f11/grup-9'
        season:
          - '2627'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        run: |
          node scripts/sync-actas-api.js \
            --league "${{ matrix.league }}" \
            --season "${{ matrix.season }}"
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run classification sync
        run: |
          node scripts/sync-classificacio.js \
            --league "${{ matrix.league }}" \
            --season "${{ matrix.season }}"
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Step summary
        if: always()
        run: |
          @(
            "## Sync Actas · FUTFEM_APP"
            "| | |"
            "|---|---|"
            "| **Liga** | ${{ matrix.league }} |"
            "| **Season** | ${{ matrix.season }} |"
            "| **Timestamp** | $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC |"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

  # ─── MANUAL: liga + temporada específica ─────────────────────────────────────
  sync-manual:
    if: github.event_name == 'workflow_dispatch'
    name: "Manual Sync · ${{ inputs.league }}"
    runs-on: [self-hosted, fcf]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        run: |
          $flags = @('--league', '${{ inputs.league }}', '--season', '${{ inputs.season }}')
          if ('${{ inputs.dry_run }}' -eq 'true') { $flags += '--dry-run' }
          Write-Host "▶ node scripts/sync-actas-api.js $flags"
          node scripts/sync-actas-api.js @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run classification sync
        if: ${{ inputs.dry_run != true }}
        run: |
          Write-Host "▶ node scripts/sync-classificacio.js --league ${{ inputs.league }} --season ${{ inputs.season }}"
          node scripts/sync-classificacio.js --league "${{ inputs.league }}" --season "${{ inputs.season }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Step summary
        if: always()
        run: |
          @(
            "## Manual Sync · FUTFEM_APP"
            "| | |"
            "|---|---|"
            "| **Liga** | ${{ inputs.league }} |"
            "| **Season** | ${{ inputs.season }} |"
            "| **Dry run** | ${{ inputs.dry_run }} |"
            "| **Timestamp** | $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC |"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
